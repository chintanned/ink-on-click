<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ink on Click</title>
<meta name="description" content="Click and drag watercolor ink for the web. WebGL2, no dependencies." />
<meta property="og:title" content="Ink on Click" />
<meta property="og:description" content="Click and drag watercolor ink for the web. WebGL2, no dependencies." />
<style>/* Dialkit Theme - Dark glassmorphic design */
.dialkit-root {
  position: relative;

  /* Surfaces */
  --dial-surface: rgba(255, 255, 255, 0.05);
  --dial-surface-hover: rgba(255, 255, 255, 0.1);
  --dial-surface-active: rgba(255, 255, 255, 0.11);
  --dial-surface-subtle: rgba(255, 255, 255, 0.06);

  /* Text hierarchy - 3 levels */
  --dial-text-root: #FFFFFF;   /* Root title */
  --dial-text-section: rgba(255, 255, 255, 0.7); /* Section titles + carets */
  --dial-text-label: rgba(255, 255, 255, 0.7);   /* Input labels */
  --dial-text-focus: #ffffff;

  /* Legacy aliases */
  --dial-text-primary: rgba(255, 255, 255, 0.95);
  --dial-text-secondary: rgba(255, 255, 255, 0.6);
  --dial-text-tertiary: rgba(255, 255, 255, 0.4);

  /* Borders */
  --dial-border: rgba(255, 255, 255, 0.1);
  --dial-border-hover: rgba(255, 255, 255, 0.15);
  --dial-focus-ring: rgba(255, 255, 255, 0.6);

  /* Timeline clips are light by default; light themes add a dark tint so
     their shape stays distinct from the lane without replacing custom hues. */
  --dial-timeline-clip-overlay: transparent;

  /* Glassmorphic panel */
  --dial-glass-bg: #212121;
  --dial-dropdown-bg: #2a2a2a;
  --dial-backdrop-blur: 20px;
  --dial-radius: 8px;
  --dial-row-height: 36px;
  --dial-row-gap: 6px;
  --dial-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  --dial-shadow-collapsed: 0 4px 16px rgba(0, 0, 0, 0.25);
  --dial-shadow-dropdown: 0 8px 24px rgba(0, 0, 0, 0.4);

  /* Fonts */
  font-family: system-ui, -apple-system, 'SF Pro Display', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.dialkit-panel {
  position: fixed;
  z-index: 9999;
  max-height: calc(100vh - 32px);
  overflow: visible;
}

/* Inline mode */
.dialkit-root[data-mode="inline"] {
  max-height: 100%;
}

.dialkit-panel[data-mode="inline"] {
  position: static;
  z-index: auto;
  max-height: inherit;
  height: auto;
  overflow: visible;
}

.dialkit-panel-inner {
  box-sizing: border-box;
  background: var(--dial-glass-bg);
  border: 1px solid var(--dial-border);
  border-radius: 14px;
  backdrop-filter: blur(var(--dial-backdrop-blur));
  -webkit-backdrop-filter: blur(var(--dial-backdrop-blur));
  padding: 10px 12px;
  transform: translateZ(0);
  transform-origin: var(--dial-origin-y, top) var(--dial-origin-x, right);
}

.dialkit-panel[data-origin-x="left"] {
  --dial-origin-x: left;
}

.dialkit-panel[data-origin-x="right"] {
  --dial-origin-x: right;
}

.dialkit-panel[data-origin-y="top"] {
  --dial-origin-y: top;
}

.dialkit-panel[data-origin-y="bottom"] {
  --dial-origin-y: bottom;
}

.dialkit-panel[data-position="top-left"] .dialkit-panel-inner {
  max-height: calc(100vh - 80px);
  overflow-y: auto;
}


.dialkit-panel-inner[data-collapsed="true"] {
  transform-origin: center;
  border-radius: 50%;
  padding: 12px;
  box-sizing: border-box;
}

.dialkit-panel-inner[data-collapsed="true"] .dialkit-panel-header {
  padding-bottom: 0;
  margin-bottom: 0;
  border-bottom: none;
}

.dialkit-panel-inner[data-collapsed="true"] .dialkit-folder-title-row {
  display: none;
}

.dialkit-panel-inner[data-collapsed="true"] .dialkit-folder-header-top {
  justify-content: center;
  padding: 0;
}

.dialkit-panel-inner::-webkit-scrollbar {
  display: none;
}

.dialkit-panel-inner {
  -ms-overflow-style: none;
  scrollbar-width: none;
  overflow-anchor: none;
}

.dialkit-panel-inner[data-folding="true"]:not(.dialkit-panel-inline) {
  height: var(--dial-panel-fold-height) !important;
}

/* Put the top inset inside the sticky header so it never scrolls away. */
.dialkit-panel-inner:not([data-collapsed="true"]) {
  padding-top: 0;
}

.dialkit-panel-inner:not([data-collapsed="true"]) > .dialkit-folder-root > .dialkit-panel-header {
  position: sticky;
  top: 0;
  z-index: 3;
  padding-top: 10px;
  background: var(--dial-glass-bg);
}

/* Cover the side gutters too, including when a section pushes its header up. */
.dialkit-panel-inner:not([data-collapsed="true"]) > .dialkit-folder-root > .dialkit-panel-header::before,
.dialkit-folder-section > .dialkit-folder-header::before {
  content: '';
  position: absolute;
  inset: 0 -12px;
  z-index: -1;
  background: var(--dial-glass-bg);
  pointer-events: none;
}

.dialkit-panel-inner:not([data-collapsed="true"]) > .dialkit-folder-root > .dialkit-panel-header .dialkit-panel-icon {
  right: 0;
}

.dialkit-panel-inline {
  width: 100%;
  height: auto;
  max-height: inherit;
  /* Use the host's scroll container so sticky headers also work when embedded. */
  overflow: visible;
  box-shadow: none;
  border-radius: 0;
  border: none;
  box-sizing: border-box;
}

.dialkit-panel[data-mode="inline"] .dialkit-panel-wrapper {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-height: inherit;
  height: auto;
}

/* Position variants */
.dialkit-panel[data-position="top-right"] {
  top: 16px;
  right: 16px;
}

.dialkit-panel[data-position="top-left"] {
  top: 16px;
  left: 16px;
}

.dialkit-panel[data-position="bottom-right"] {
  bottom: 16px;
  right: 16px;
}

.dialkit-panel[data-position="bottom-left"] {
  bottom: 16px;
  left: 16px;
}

/* Folder */
.dialkit-folder {
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--dial-surface-subtle);
}

.dialkit-folder:last-child:not(.dialkit-folder-root) {
  padding-bottom: 0;
  margin-bottom: 0;
}

.dialkit-folder-root {
  padding-bottom: 0;
  margin-bottom: 0;
  border-bottom: none;
}

.dialkit-panel-header {
  padding-bottom: 6px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--dial-surface-subtle);
}

.dialkit-panel:not([data-mode="inline"]) .dialkit-panel-inner:not([data-collapsed="true"]) > .dialkit-folder-root > .dialkit-panel-header {
  cursor: grab;
}

.dialkit-panel:not([data-mode="inline"]) .dialkit-panel-inner:not([data-collapsed="true"]) > .dialkit-folder-root > .dialkit-panel-header:active {
  cursor: grabbing;
}

.dialkit-panel:not([data-mode="inline"]) .dialkit-panel-inner:not([data-collapsed="true"]) .dialkit-panel-icon {
  color: var(--dial-text-label);
  opacity: 0.6;
}

.dialkit-panel:not([data-mode="inline"]) .dialkit-panel-icon {
  cursor: pointer;
}

.dialkit-folder-header {
  cursor: pointer;
  user-select: none;
}

.dialkit-folder-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0 8px 0;
}


.dialkit-folder-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--dial-text-section);
  letter-spacing: -0.01em;
  transform: translateY(-0.5px);
  transition: color 0.15s;
}

.dialkit-folder-title-root {
  font-size: 15px;
  font-weight: 600;
  color: var(--dial-text-root);
  transform: translateZ(0);
}

.dialkit-folder-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
}

.dialkit-folder-copy {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  padding: 0;
  background: transparent;
  border: none;
  cursor: pointer;
}

.dialkit-folder-copy svg {
  width: 14px;
  height: 14px;
  color: var(--dial-text-section);
}

.dialkit-folder-icon {
  width: 20px;
  height: 20px;
  padding: 2px;
  box-sizing: border-box;
  flex-shrink: 0;
  color: var(--dial-text-label);
  opacity: 0.6;
}

.dialkit-panel-icon {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 16px;
  height: 16px;
  color: var(--dial-text-focus);
  z-index: 1;
}

.dialkit-folder-content {
  will-change: transform;
}

/* Clip layout overflow as well as paint while a folder folds. A clip-path alone
   leaves its full contents in the outer scroll range until they unmount. */
.dialkit-folder:not(.dialkit-folder-root) > .dialkit-folder-content {
  overflow-y: clip;
}

.dialkit-folder-inner {
  display: flex;
  flex-direction: column;
  gap: var(--dial-row-gap);
  padding-bottom: 10px;
}

/* Non-root folders - top & bottom HR dividers */
.dialkit-folder:not(.dialkit-folder-root) {
  border-top: 1px solid var(--dial-surface-subtle);
  border-bottom: 1px solid var(--dial-surface-subtle);
  margin-top: 4px;
  margin-bottom: 4px;
  padding-bottom: 0;
}

.dialkit-folder:not(.dialkit-folder-root):last-child {
  border-bottom: none;
  margin-bottom: 0;
}

/* Adjacent non-root folders collapse gap and share a single divider */
.dialkit-folder:not(.dialkit-folder-root) + .dialkit-folder:not(.dialkit-folder-root) {
  margin-top: -10px;
  border-top: none;
}

/* Non-root folder header - match row height */
.dialkit-folder:not(.dialkit-folder-root) > .dialkit-folder-header {
  height: var(--dial-row-height);
  padding: 0;
}

.dialkit-folder:not(.dialkit-folder-root) > .dialkit-folder-header > .dialkit-folder-header-top {
  padding: 0;
  height: 100%;
}

/* Root folder inner needs no extra bottom padding */
.dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner {
  padding-bottom: 0;
}

/* A sole group that comes first can share the panel header's divider. */
.dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder:first-child:not(:has(~ .dialkit-folder)) {
  border-top: none;
  margin-top: 0;
}

.dialkit-panel[data-multiple="true"] .dialkit-panel-inner:not([data-collapsed="true"]) {
  padding: 0 12px;
}

.dialkit-panel[data-multiple="true"] .dialkit-panel-inner:not([data-collapsed="true"]) .dialkit-panel-icon {
  top: 14px;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-panel-header {
  padding-top: 0;
  padding-bottom: 0;
  margin-bottom: 0;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-panel-header > .dialkit-folder-header-top,
.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder > .dialkit-folder-header > .dialkit-folder-header-top {
  height: 44px;
  padding: 0;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder > .dialkit-folder-header {
  height: auto;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner {
  gap: 0;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder {
  margin: 0;
  padding-bottom: 0;
  border-top: 1px solid var(--dial-surface-subtle);
  border-bottom: none;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder > .dialkit-folder-header .dialkit-folder-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 20px;
  color: var(--dial-text-root);
  transform: translateZ(0);
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-title-root {
  line-height: 20px;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder:first-child {
  border-top: none;
  margin-top: 0;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder + .dialkit-folder {
  margin-top: 0;
}

.dialkit-panel[data-multiple="true"] .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder > .dialkit-folder-content > .dialkit-folder-inner {
  padding-top: 0;
  padding-bottom: 12px;
}

/* Only registered panels stick; ordinary folders remain part of the content. */
.dialkit-panel .dialkit-folder.dialkit-folder-section > .dialkit-folder-header {
  position: sticky;
  top: var(--dial-panel-header-height, 0px);
  z-index: 2;
  height: auto;
  background: var(--dial-glass-bg);
}

.dialkit-folder-section {
  --dial-section-header-height: calc(44px + var(--dial-row-height) + 10px);
}

/* Keyboard navigation must reveal controls below both pinned header rows. */
.dialkit-folder-inner :is(button, input, textarea, [tabindex]) {
  scroll-margin-top: calc(var(--dial-panel-header-height, 0px) + var(--dial-section-header-height, 0px) + var(--dial-row-gap));
}

.dialkit-folder.dialkit-folder-section > .dialkit-folder-header > .dialkit-folder-header-top {
  height: var(--dial-row-height);
}

.dialkit-panel-section-toolbar-clip {
  overflow-y: clip;
}

.dialkit-folder-section > .dialkit-folder-header > .dialkit-panel-section-toolbar-clip > .dialkit-panel-section-toolbar {
  padding-top: 4px;
  padding-bottom: var(--dial-row-gap);
  box-sizing: content-box;
}

.dialkit-panel-toolbar:empty,
.dialkit-panel-section-toolbar:empty {
  display: none;
}

/* Content spacing handled by folder-inner gap */


/* Slider */
.dialkit-slider-wrapper {
  position: relative;
  height: var(--dial-row-height);
}

.dialkit-slider {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  user-select: none;
  overflow: hidden;
  background: var(--dial-surface);
  border-radius: var(--dial-radius);
  touch-action: none;
}

.dialkit-slider-hashmarks {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.dialkit-slider-hashmark {
  position: absolute;
  top: 50%;
  width: 1px;
  height: 8px;
  border-radius: 999px;
  transform: translateX(-50%) translateY(-50%);
  background: rgba(255, 255, 255, 0);
  transition: background 200ms;
}

.dialkit-slider-active .dialkit-slider-hashmark {
  background: var(--dial-border-hover);
}

.dialkit-slider-active .dialkit-slider-value {
  color: var(--dial-text-focus);
}

.dialkit-slider-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  background: var(--dial-surface-active);
  transition: background 0.15s;
  pointer-events: none;
}

.dialkit-slider-active .dialkit-slider-fill {
  background: var(--dial-border-hover);
}

.dialkit-slider-handle {
  position: absolute;
  top: 50%;
  width: 3px;
  height: 20px;
  border-radius: 999px;
  background: var(--dial-text-primary);
  pointer-events: none;
}

.dialkit-slider-label {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(calc(-50% - 0.5px));
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-label);
  pointer-events: none;
  transition: color 0.15s;
  display: inline-flex;
  align-items: center;
}

.dialkit-slider-value {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(calc(-50% + 0.5px));
  font-size: 13px;
  font-weight: 500;
  font-family: 'Geist Mono', monospace;
  color: var(--dial-text-label);
  pointer-events: auto;
  transition: color 0.15s, border-color 0.15s;
  border-bottom: 1px solid transparent;
  padding-bottom: 1px;
}

.dialkit-slider-value-editable {
  border-bottom-color: var(--dial-text-label);
}

.dialkit-slider-input {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 4ch;
  min-width: 3ch;
  max-width: 6ch;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Geist Mono', monospace;
  color: var(--dial-text-label);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--dial-text-label);
  padding: 0 0 1px 0;
  outline: none;
  text-align: right;
}

.dialkit-slider-input:focus {
  color: var(--dial-text-focus);
}

/* Segmented Control */
.dialkit-segmented {
  position: relative;
  display: flex;
  padding: 2px;
  background: transparent;
  border-radius: var(--dial-radius);
}

.dialkit-segmented-pill {
  position: absolute;
  top: 2px;
  bottom: 2px;
  background: var(--dial-surface-active);
  border-radius: 6px;
  z-index: 0;
  pointer-events: none;
}

.dialkit-segmented-button {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  padding: 6px 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: color 0.15s;
}

.dialkit-segmented-button[data-active="true"] {
  color: var(--dial-text-primary);
}

.dialkit-segmented-button[data-active="false"] {
  color: var(--dial-text-label);
}

/* Toggle */
.dialkit-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--dial-surface);
  border-radius: var(--dial-radius);
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}

.dialkit-toggle:hover {
  background: var(--dial-surface-hover);
}

.dialkit-toggle-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-label);
  transition: color 0.15s;
}

.dialkit-toggle[data-checked="true"] .dialkit-toggle-label {
  color: var(--dial-text-primary);
}

.dialkit-toggle-track {
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: var(--dial-surface-active);
  transition: background 0.2s;
  position: relative;
}

.dialkit-toggle[data-checked="true"] .dialkit-toggle-track {
  background: var(--dial-border-hover);
}

.dialkit-toggle-thumb {
  position: absolute;
  top: 2px;
  width: 16px;
  height: 16px;
  border-radius: 8px;
  background: var(--dial-text-primary);
}

/* Button Group */
.dialkit-button-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dialkit-button {
  flex: 1;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-secondary);
  background: var(--dial-surface);
  border: none;
  border-radius: var(--dial-radius);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.dialkit-button:hover {
  background: var(--dial-surface-hover);
  color: var(--dial-text-primary);
}

.dialkit-button:active {
  background: var(--dial-surface-active);
}

/* Labeled Control Row (label + control side by side) */
.dialkit-labeled-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: var(--dial-row-height);
  padding: 2px 10px 2px 12px;
  background: var(--dial-surface);
  border-radius: var(--dial-radius);
}

.dialkit-labeled-control-label {
  display: flex;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-label);
  flex-shrink: 0;
  line-height: 17px;
}

.dialkit-labeled-control .dialkit-segmented {
  flex-shrink: 0;
  margin-right: -6px;
}

.dialkit-action-button {
  width: 160px;
  flex-shrink: 0;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-secondary);
  background: var(--dial-surface);
  border: none;
  border-radius: var(--dial-radius);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.dialkit-action-button:hover {
  background: var(--dial-surface-hover);
  color: var(--dial-text-primary);
}

.dialkit-action-button:active {
  background: var(--dial-surface-active);
}

.dialkit-actions-group {
  align-items: flex-start;
}

.dialkit-actions-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 160px;
}

/* Spring Visualization */
.dialkit-spring-viz {
  width: 100%;
  border-radius: var(--dial-radius);
  background: var(--dial-surface);
  overflow: visible;
}

.dialkit-easing-viz {
  position: relative;
  width: 100%;
  aspect-ratio: 256 / 180;
  border-radius: var(--dial-radius);
  background: var(--dial-surface);
  overflow: hidden;
  isolation: isolate;
}

.dialkit-easing-viz svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.dialkit-easing-reference {
  stroke: var(--dial-text-tertiary);
  stroke-width: 1;
  stroke-dasharray: 3 4;
  opacity: 0.4;
}

.dialkit-easing-tangent {
  stroke: var(--dial-text-tertiary);
  stroke-width: 1;
}

.dialkit-easing-curve {
  fill: none;
  stroke: var(--dial-text-primary);
  stroke-width: 2;
  stroke-linecap: round;
}

.dialkit-easing-endpoint {
  fill: var(--dial-text-secondary);
}

.dialkit-easing-handle {
  position: absolute;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  transform: translate(-50%, -50%);
  cursor: grab;
  touch-action: none;
  user-select: none;

}

  cursor: default;
}

.dialkit-preset-trigger[data-disabled="true"]:hover {
  background: var(--dial-surface);
}

.dialkit-preset-trigger[data-open="true"] {
  background: var(--dial-surface-active);
}

.dialkit-preset-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


.dialkit-preset-dropdown {
  margin: 0;
  inset: auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  width: max-content;
  background: var(--dial-dropdown-bg);
  border: 1px solid var(--dial-border);
  border-radius: 12px;
  padding: 4px;
  z-index: 10000;
  box-shadow: var(--dial-shadow-dropdown);
}

.dialkit-preset-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--dial-border);
}

.dialkit-preset-item {
  box-sizing: border-box;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  gap: 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}

.dialkit-preset-item + .dialkit-preset-item {
  margin-top: 2px;
}

.dialkit-preset-item:hover {
  background: var(--dial-surface-hover);
}

.dialkit-preset-item[data-active="true"] {
  background: var(--dial-surface-active);
}

.dialkit-preset-name {
  flex: 1;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-label);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dialkit-preset-item[data-active="true"] .dialkit-preset-name {
  color: var(--dial-text-primary);
}

.dialkit-preset-delete {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  background: transparent;
  border: none;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  flex-shrink: 0;
}

.dialkit-preset-item:hover .dialkit-preset-delete {
  opacity: 0.6;
}

.dialkit-preset-item:focus-within .dialkit-preset-delete { opacity: 0.6; }
.dialkit-preset-item:focus-within { background: var(--dial-surface-hover); }

.dialkit-preset-delete:hover {
  opacity: 1 !important;
}

.dialkit-preset-delete svg {
  transition: color 150ms ease;
  width: 14px;
  height: 14px;
  color: var(--dial-text-focus);
  pointer-events: none;
}

.dialkit-preset-delete:hover svg {
  color: #ff3b30;
}

.dialkit-preset-save-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-label);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.dialkit-preset-save-btn:hover {
  background: var(--dial-surface-hover);
  color: var(--dial-text-primary);
}

.dialkit-preset-save-btn svg {
  width: 12px;
  height: 12px;
}

.dialkit-preset-save-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px;
}

.dialkit-preset-input {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  font-family: inherit;
  font-size: 13px;
  color: var(--dial-text-primary);
  background: var(--dial-surface);
  border: 1px solid var(--dial-border);
  border-radius: 6px;
  outline: none;
}

.dialkit-preset-input:focus {
  border-color: var(--dial-text-label);
}

.dialkit-preset-input::placeholder {
  color: var(--dial-text-tertiary);
}

.dialkit-preset-confirm {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  background: var(--dial-surface);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
}

.dialkit-preset-confirm:hover:not(:disabled) {
  background: var(--dial-surface-hover);
}

.dialkit-preset-confirm:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.dialkit-preset-confirm svg {
  width: 14px;
  height: 14px;
  color: var(--dial-text-label);
}

/* Shortcut Pill */
.dialkit-shortcut-pill {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--dial-text-tertiary);
  background: var(--dial-surface-subtle);
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
  letter-spacing: 0.02em;
  line-height: 16px;
  white-space: nowrap;
  vertical-align: middle;
  transition: color 0.15s, background 0.15s;
}

.dialkit-shortcut-pill-active {
  color: var(--dial-text-primary);
  background: var(--dial-border-hover);
}

/* Shortcuts Menu Trigger */
.dialkit-shortcuts-trigger {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--dial-row-height);
  height: var(--dial-row-height);
  padding: 0;
  flex-shrink: 0;
  background: var(--dial-surface);
  border: none;
  border-radius: var(--dial-radius);
  cursor: pointer;
  transition: background 0.15s;
}

.dialkit-shortcuts-trigger:hover {
  background: var(--dial-surface-hover);
}

.dialkit-shortcuts-trigger svg {
  width: 16px;
  height: 16px;
  color: var(--dial-text-label);
}

/* Shortcuts Dropdown */
.dialkit-shortcuts-dropdown {
  background: var(--dial-dropdown-bg);
  border: 1px solid var(--dial-border);
  border-radius: 12px;
  padding: 8px;
  z-index: 10000;
  box-shadow: var(--dial-shadow-dropdown);
  min-width: 200px;
}

.dialkit-shortcuts-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--dial-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 4px 8px 8px;
}

.dialkit-shortcuts-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.dialkit-shortcuts-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px;
  border-radius: 6px;
}

.dialkit-shortcuts-row-key {
  font-size: 11px;
  font-weight: 600;
  font-family: ui-monospace, 'SF Mono', 'Courier New', monospace;
  color: var(--dial-text-secondary);
  background: var(--dial-surface-subtle);
  padding: 2px 6px;
  border-radius: 4px;
  min-width: 28px;
  text-align: center;
}

.dialkit-shortcuts-row-label {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-label);
}

.dialkit-shortcuts-row-mode {
  font-size: 11px;
  font-weight: 500;
  color: var(--dial-text-tertiary);
  font-style: italic;
}

.dialkit-shortcuts-hint {
  font-size: 11px;
  color: var(--dial-text-tertiary);
  padding: 6px 8px 2px;
  border-top: 1px solid var(--dial-border);
  margin-top: 4px;
}

/* ── Light Theme ── */
.dialkit-root[data-theme="light"] {
  --dial-surface: rgba(0, 0, 0, 0.04);
  --dial-surface-hover: rgba(0, 0, 0, 0.08);
  --dial-surface-active: rgba(0, 0, 0, 0.1);
  --dial-surface-subtle: rgba(0, 0, 0, 0.06);

  --dial-text-root: #000000;
  --dial-text-section: rgba(0, 0, 0, 0.65);
  --dial-text-label: rgba(0, 0, 0, 0.6);
  --dial-text-focus: #000000;

  --dial-text-primary: rgba(0, 0, 0, 0.9);
  --dial-text-secondary: rgba(0, 0, 0, 0.55);
  --dial-text-tertiary: rgba(0, 0, 0, 0.35);

  --dial-border: rgba(0, 0, 0, 0.1);
  --dial-border-hover: rgba(0, 0, 0, 0.15);
  --dial-focus-ring: rgba(0, 0, 0, 0.55);

  --dial-timeline-clip-overlay: rgba(0, 0, 0, 0.28);

  --dial-glass-bg: #fafafa;
  --dial-dropdown-bg: #ffffff;
  --dial-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  --dial-shadow-collapsed: 0 2px 10px rgba(0, 0, 0, 0.06);
  --dial-shadow-dropdown: 0 4px 16px rgba(0, 0, 0, 0.08);
}

/* Light mode: SVG visualization overrides */
.dialkit-root[data-theme="light"] .dialkit-spring-viz line {
  stroke: rgba(0, 0, 0, 0.08);
}

.dialkit-root[data-theme="light"] .dialkit-spring-viz line[stroke-dasharray] {
  stroke: rgba(0, 0, 0, 0.15);
}

.dialkit-root[data-theme="light"] .dialkit-spring-viz path {
  stroke: rgba(0, 0, 0, 0.5);
}

/* Light mode: toggle thumb needs shadow for definition */
.dialkit-root[data-theme="light"] .dialkit-toggle-thumb {
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.08);
}

/* ── System preference: light ── */
@media (prefers-color-scheme: light) {
  .dialkit-root[data-theme="system"] {
    --dial-surface: rgba(0, 0, 0, 0.04);
    --dial-surface-hover: rgba(0, 0, 0, 0.08);
    --dial-surface-active: rgba(0, 0, 0, 0.1);
    --dial-surface-subtle: rgba(0, 0, 0, 0.06);

    --dial-text-root: #000000;
    --dial-text-section: rgba(0, 0, 0, 0.65);
    --dial-text-label: rgba(0, 0, 0, 0.6);
    --dial-text-focus: #000000;

    --dial-text-primary: rgba(0, 0, 0, 0.9);
    --dial-text-secondary: rgba(0, 0, 0, 0.55);
    --dial-text-tertiary: rgba(0, 0, 0, 0.35);

    --dial-border: rgba(0, 0, 0, 0.1);
    --dial-border-hover: rgba(0, 0, 0, 0.15);
    --dial-focus-ring: rgba(0, 0, 0, 0.55);

    --dial-timeline-clip-overlay: rgba(0, 0, 0, 0.28);

    --dial-glass-bg: #fafafa;
    --dial-dropdown-bg: #ffffff;
    --dial-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    --dial-shadow-collapsed: 0 2px 10px rgba(0, 0, 0, 0.06);
    --dial-shadow-dropdown: 0 4px 16px rgba(0, 0, 0, 0.08);
  }

  .dialkit-root[data-theme="system"] .dialkit-spring-viz line {
    stroke: rgba(0, 0, 0, 0.08);
  }

  .dialkit-root[data-theme="system"] .dialkit-spring-viz line[stroke-dasharray] {
    stroke: rgba(0, 0, 0, 0.15);
  }

  .dialkit-root[data-theme="system"] .dialkit-spring-viz path {
    stroke: rgba(0, 0, 0, 0.5);
  }

  .dialkit-root[data-theme="system"] .dialkit-toggle-thumb {
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.08);
  }

}

/* ── Timeline dock ── */
.dialkit-timeline {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 9998;
}

.dialkit-timeline[hidden] {
  display: none;
}

.dialkit-timeline-dock {
  position: relative;
  box-sizing: border-box;
  background: var(--dial-glass-bg);
  border: 1px solid var(--dial-border);
  border-radius: 14px;
  backdrop-filter: blur(var(--dial-backdrop-blur));
  -webkit-backdrop-filter: blur(var(--dial-backdrop-blur));
  padding: 0 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--dial-text-tertiary) transparent;
}

.dialkit-timeline-resize-handle {
  position: absolute;
  top: -4px;
  left: 0;
  right: 0;
  z-index: 9;
  height: 10px;
  cursor: ns-resize;
  touch-action: none;
}

.dialkit-timeline-dock::-webkit-scrollbar {
  width: 8px;
}

.dialkit-timeline-dock::-webkit-scrollbar-track {
  background: transparent;
}

.dialkit-timeline-dock::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: var(--dial-text-tertiary);
}

.dialkit-timeline-section {
  --dial-timeline-label-w: 96px;
  --dial-timeline-actions-w: 284px;
  --dial-timeline-header-h: calc(var(--dial-row-height) + 4px);
}

.dialkit-timeline-section + .dialkit-timeline-section {
  border-top: 1px solid var(--dial-border);
  padding-top: 10px;
}

.dialkit-timeline-header {
  display: grid;
  grid-template-columns: auto minmax(100px, 1fr) auto;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 7;
  box-sizing: border-box;
  height: var(--dial-timeline-header-h);
  padding: 4px 0 0;
  margin: 0;
  background: var(--dial-glass-bg);
  backdrop-filter: blur(var(--dial-backdrop-blur));
  -webkit-backdrop-filter: blur(var(--dial-backdrop-blur));
}

.dialkit-timeline-header[data-open] {
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
}

.dialkit-timeline-header:not([data-open]) {
  grid-template-columns: var(--dial-timeline-label-w) minmax(0, 1fr) auto;
  gap: 0;
}

.dialkit-timeline-header:not([data-open]) .dialkit-timeline-identity {
  width: var(--dial-timeline-label-w);
  box-sizing: border-box;
  padding-right: 10px;
  overflow: hidden;
}

.dialkit-timeline-header:not([data-open]) .dialkit-timeline-title {
  overflow: hidden;
  text-overflow: ellipsis;
}

.dialkit-timeline-header:not([data-open]) .dialkit-timeline-overview {
  margin-right: 12px;
}

.dialkit-timeline-identity {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.dialkit-timeline-title {
  display: block;
  min-width: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--dial-text-root);
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.dialkit-timeline-header[data-open] .dialkit-timeline-identity {
  width: 100%;
  overflow: hidden;
}

.dialkit-timeline-header[data-open] .dialkit-timeline-title {
  display: inline-block;
  flex: 0 1 auto;
  width: fit-content;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dialkit-timeline-time {
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--dial-text-label);
  white-space: nowrap;
}

.dialkit-timeline-overview {
  position: relative;
  min-width: 60px;
  height: 12px;
  border-radius: 999px;
  background: var(--dial-surface-subtle);
  overflow: hidden;
  cursor: col-resize;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.dialkit-timeline-overview-viewport {
  position: absolute;
  inset-block: 0;
  border-radius: inherit;
  pointer-events: none;
}

.dialkit-timeline-overview-viewport[data-zoomed] {
  background: color-mix(in srgb, var(--dial-text-tertiary) 18%, transparent);
  box-shadow: inset 0 0 0 1px var(--dial-border);
}

.dialkit-timeline-overview-progress {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 999px 0 0 999px;
  background: var(--dial-text-tertiary);
  opacity: 0.35;
  pointer-events: none;
}

.dialkit-timeline-overview-playhead {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  border-radius: 2px;
  background: var(--dial-text-root);
  transform: translateX(-1px);
  pointer-events: none;
}

.dialkit-timeline-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.dialkit-timeline-header[data-open] .dialkit-timeline-actions {
  width: auto;
  box-sizing: border-box;
  justify-content: flex-end;
  padding-left: 0;
}

.dialkit-timeline-actions .dialkit-preset-manager {
  flex: 0 0 120px;
  width: 120px;
}

.dialkit-timeline-chevron {
  background: none;
  border: none;
  width: 20px;
  height: var(--dial-row-height);
  padding: 2px;
  cursor: pointer;
  color: var(--dial-text-label);
  opacity: 0.6;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}

.dialkit-timeline-chevron:hover {
  opacity: 1;
}

.dialkit-timeline-chevron svg {
  width: 16px;
  height: 16px;
  transition: transform 0.18s ease;
}

.dialkit-timeline-chevron[data-open="true"] svg {
  transform: rotate(180deg);
}

.dialkit-timeline-body {
  margin-top: 0;
  overflow: visible;
}

.dialkit-timeline-scroll-row {
  position: sticky;
  bottom: -10px;
  z-index: 6;
  display: grid;
  grid-template-columns: var(--dial-timeline-label-w) minmax(0, 1fr);
  margin-top: 6px;
  margin-bottom: -10px;
  padding: 4px 0 10px;
  background: var(--dial-glass-bg);
  backdrop-filter: blur(var(--dial-backdrop-blur));
  -webkit-backdrop-filter: blur(var(--dial-backdrop-blur));
}

.dialkit-timeline-horizontal-scroll {
  min-width: 0;
  height: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--dial-text-tertiary) transparent;
  overscroll-behavior-x: contain;
}

.dialkit-timeline-horizontal-scroll > div {
  height: 1px;
}

.dialkit-timeline-horizontal-scroll::-webkit-scrollbar {
  height: 8px;
}

.dialkit-timeline-horizontal-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.dialkit-timeline-horizontal-scroll::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: var(--dial-text-tertiary);
}

.dialkit-timeline-grid {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dialkit-timeline-row {
  display: grid;
  grid-template-columns: var(--dial-timeline-label-w) minmax(0, 1fr);
  align-items: stretch;
}

.dialkit-timeline-label {
  flex: 0 0 var(--dial-timeline-label-w);
  box-sizing: border-box; /* indent padding must not widen the column — every lane starts at the same x */
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 500;
  color: var(--dial-text-label);
  padding-right: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
}

.dialkit-timeline-ruler {
  position: relative;
  min-width: 0;
  height: 28px;
  cursor: col-resize;
  touch-action: none;
  overflow: visible;
  user-select: none;
  -webkit-user-select: none;
  z-index: 5;
}

.dialkit-timeline-ruler-row {
  position: sticky;
  top: var(--dial-timeline-header-h);
  z-index: 6;
  height: 28px;
  background: var(--dial-glass-bg);
  backdrop-filter: blur(var(--dial-backdrop-blur));
  -webkit-backdrop-filter: blur(var(--dial-backdrop-blur));
}

.dialkit-timeline-tick {
  position: absolute;
  top: 50%;
  width: 1px;
  height: 100%;
  background: var(--dial-text-tertiary);
  transform: translateY(-50%);
  pointer-events: none;
}

.dialkit-timeline-tick-medium {
  height: 16px;
  background: var(--dial-border-hover);
}

.dialkit-timeline-tick-fine {
  height: 8px;
  background: var(--dial-border);
}

.dialkit-timeline-tick-label {
  position: absolute;
  top: 50%;
  left: 4px;
  display: flex;
  align-items: center;
  height: 18px;
  transform: translateY(-50%);
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 9.5px;
  line-height: 18px;
  font-variant-numeric: tabular-nums;
  color: var(--dial-text-tertiary);
  white-space: nowrap;
}

.dialkit-timeline-row {
  height: 28px;
}

/* ── Layer groups ── */

.dialkit-timeline-group-row {
  height: 22px;
}

.dialkit-timeline-group-row .dialkit-timeline-label {
  gap: 4px;
  font-weight: 600;
  color: var(--dial-text-root);
}

.dialkit-timeline-group-row .dialkit-timeline-lane {
  background: none;
}

.dialkit-timeline-group-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  padding: 0;
  margin-left: -2px;
  cursor: pointer;
  color: var(--dial-text-tertiary);
}

.dialkit-timeline-group-toggle svg {
  width: 10px;
  height: 10px;
  transform: rotate(-90deg);
  transition: transform 0.15s ease;
}

.dialkit-timeline-group-toggle[data-open="true"] svg {
  transform: rotate(0deg);
}

.dialkit-timeline-row[data-grouped] .dialkit-timeline-label {
  padding-left: 14px;
}

.dialkit-timeline-lane {
  position: relative;
  flex: 1;
  background: var(--dial-surface-subtle);
  border-radius: 8px;
  overflow: hidden;
}

.dialkit-timeline-clip {
  position: absolute;
  top: 3px;
  bottom: 3px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 9px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  box-sizing: border-box;
  overflow: hidden;
  z-index: 1;
  box-shadow: inset 0 0 0 999px var(--dial-timeline-clip-overlay);
}

.dialkit-timeline-clip-ghost {
  position: absolute;
  top: 4px;
  bottom: 4px;
  display: flex;
  border-radius: 5px;
  box-sizing: border-box;
  overflow: hidden;
  opacity: 0.18;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.dialkit-timeline-clip-ghost-segment {
  height: 100%;
  flex-shrink: 0;
  box-sizing: border-box;
}

.dialkit-timeline-clip-ghost-segment + .dialkit-timeline-clip-ghost-segment {
  box-shadow: inset 1px 0 0 rgba(0, 0, 0, 0.5);
}

.dialkit-timeline-loop-infinity {
  position: absolute;
  top: 50%;
  right: 7px;
  z-index: 2;
  color: var(--dial-text-tertiary);
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  transform: translateY(-50%);
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.dialkit-timeline-clip[data-dragging] {
  cursor: grabbing;
}

.dialkit-timeline-clip[data-selected] {
  box-shadow:
    0 0 0 2px var(--dial-text-root),
    inset 0 0 0 999px var(--dial-timeline-clip-overlay);
}

.dialkit-timeline-clip-duration {
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  color: rgba(0, 0, 0, 0.55);
  white-space: nowrap;
  pointer-events: none;
}

/* ── Sequence segments ──
   A steps clip is one bar sliced into legs; boundaries between legs are
   drag handles that retime the leg to their left. */

.dialkit-timeline-clip[data-steps] {
  padding: 0;
  justify-content: flex-start;
}

.dialkit-timeline-clip-segment {
  position: relative;
  height: 100%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 8px;
  box-sizing: border-box;
  overflow: hidden;
}

.dialkit-timeline-clip-segment + .dialkit-timeline-clip-segment {
  box-shadow: inset 1.5px 0 0 rgba(0, 0, 0, 0.25);
}

.dialkit-timeline-clip-segment:hover {
  background: rgba(0, 0, 0, 0.06);
}

.dialkit-timeline-clip-segment[data-selected] {
  background: rgba(0, 0, 0, 0.12);
}

/* ── Property tracks ──
   A props clip's row is a read-only composite — click to expand. Each
   property expands into a full track row: a complete clip bar whose
   position is the track's delay. */

.dialkit-timeline-clip[data-composite] {
  cursor: pointer;
}

.dialkit-timeline-track-row .dialkit-timeline-label {
  font-size: 13px;
  color: var(--dial-text-tertiary);
  padding-left: 26px;
}

.dialkit-timeline-track-row[data-grouped] .dialkit-timeline-label {
  padding-left: 32px;
}

.dialkit-timeline-clip-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 8px;
  cursor: ew-resize;
}

.dialkit-timeline-clip-handle[data-edge="start"] {
  left: 0;
}

.dialkit-timeline-clip-handle[data-edge="end"] {
  right: 0;
}

.dialkit-timeline-playhead-control {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 12px;
  margin-left: -6px;
  cursor: ew-resize;
  touch-action: none;
}

.dialkit-timeline-playhead-anchor {
  position: sticky;
  top: calc(var(--dial-timeline-header-h) + 14px);
  z-index: 8;
  width: 0;
  height: 0;
  margin-left: 6px;
}

.dialkit-timeline-playhead-anchor::before {
  content: '';
  position: absolute;
  top: 0;
  left: -1px;
  width: 2px;
  height: 15px;
  background: var(--dial-text-root);
  pointer-events: none;
}

.dialkit-timeline-playhead-flag {
  position: absolute;
  top: 0;
  left: calc(var(--dial-timeline-playhead-flag-offset, 0px) - 26px);
  z-index: 1;
  width: 52px;
  height: 18px;
  padding: 0 7px;
  box-sizing: border-box;
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 6px;
  background: #f3f3f3;
  color: #414141;
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 9.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
  line-height: 16px;

  white-space: nowrap;
  transform: translateY(-50%);

  transition: top 0.12s ease;
}

.dialkit-timeline-playhead-stem {
  position: absolute;
  top: 27px;
  bottom: 0;
  left: 5px;
  z-index: 5;
  width: 2px;
  background: var(--dial-text-root);
  pointer-events: none;
}

/* ── Timeline clip popover ── */
.dialkit-timeline-popover {
  position: fixed;
  z-index: 10000;
  background: var(--dial-glass-bg);
  border: 1px solid var(--dial-border);
  border-radius: 14px;
  backdrop-filter: blur(var(--dial-backdrop-blur));
  -webkit-backdrop-filter: blur(var(--dial-backdrop-blur));
  box-shadow: var(--dial-shadow);
  padding: 10px 12px;
  box-sizing: border-box;
  max-height: 60vh;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.dialkit-timeline-popover::-webkit-scrollbar {
  display: none;
}

.dialkit-timeline-popover-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 2px 8px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--dial-border);
}

.dialkit-timeline-popover-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--dial-text-root);
  letter-spacing: -0.01em;
}

.dialkit-timeline-popover-close {
  width: 24px;
  height: 24px;
  margin-left: auto;
  padding: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--dial-text-tertiary);
  cursor: pointer;
}

.dialkit-timeline-popover-close:hover {
  color: var(--dial-text-root);
  background: var(--dial-surface-hover);
}

.dialkit-timeline-popover-close svg {
  width: 14px;
  height: 14px;
}

.dialkit-timeline-popover-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dialkit-timeline-popover-body > .dialkit-folder:first-child {
  margin-top: 0;
  border-top: none;
}

@media (max-width: 720px) {

  }

    gap: 8px;
  }

  .dialkit-timeline-section {

  .dialkit-timeline-time {
    font-size: 11px;
  }

  .dialkit-timeline-overview {
    height: 12px;
  }

  .dialkit-timeline-actions {
    min-width: 0;
  }

  .dialkit-timeline-actions .dialkit-preset-manager {
    flex-basis: 100px;
    width: 100px;

  .dialkit-timeline-chevron {
    width: 26px;
    height: 28px;
    justify-content: center;
    padding: 0;
  }

  .dialkit-timeline-grid {
    min-width: 0;
  }
}

/* Keyboard focus stays inside each control so scrolling never clips its edge. */
.dialkit-root :where(button, input, textarea, [tabindex]):focus {
  outline: none;
}
.dialkit-root :where(button, [role="slider"], [role="button"], .dialkit-color-plane, .dialkit-pad-surface):focus-visible {

}

.dialkit-root :where(.dialkit-slider-input, .dialkit-color-value, .dialkit-preset-input):focus-visible {

}

.dialkit-shortcuts-dropdown { margin: 0; inset: auto; overflow-y: auto; }
@media (forced-colors: active) {

}

.dialkit-toolbar-primary {

}

}

.dialkit-toolbar-primary svg {
  color: inherit;
}

.dialkit-preset-check {

  height: 14px;
  flex-shrink: 0;
  color: var(--dial-text-focus);
}

.dialkit-preset-divider {

}

.dialkit-preset-create {

}

}

    /** Wipe all ink. */
    clear,
    /** Drop ink from code. x and y are 0 to 1 from the top left. */
    drop(x, y, amount = 1) { queue.push({ x, y: 1 - y, dx: 0, dy: 0, amt: Math.max(0, Math.min(1, amount)) }); },
    /** Stop the loop and free GPU memory. */
    destroy() {
      cancelAnimationFrame(raf); listen(false); freeTargets();
      for (const k in prog) gl.deleteProgram(prog[k].p);
      gl.deleteBuffer(vbo);
    },
  };
}


const canvas = document.getElementById("ink");
const hint = document.getElementById("hint");

let ink;
try {
  ink = createInk(canvas);
} catch (err) {
  document.getElementById("nogl").style.display = "grid";
  throw err;
}
canvas.addEventListener("pointerdown", () => hint.classList.add("gone"), { once: true });

/* ---------- DialKit playground ---------- */
const MAX_COLORS = 5;
const palette = ["#ff2d55", "#ffb800", "#1fd65f", "#1e6bff", "#b43cff"];
let colorCount = 2, colorMode = "Rainbow";

DialKit.createDialRoot({ position: "top-right", theme: "light" });

const color = {
  mode: { type: "select", options: ["Rainbow", "Custom"], default: "Rainbow" },
  hueSpeed: [defaults.hueSpeed, 0, 4, 0.05],
  newHueEachClick: defaults.newHueEachClick,
};
// all five pickers always exist and unused ones are hidden,
// so adding a color never rebuilds the panel or resets its scroll
for (let i = 0; i < MAX_COLORS; i++) color["color " + (i + 1)] = palette[i];
color.addColor = { type: "action", label: "Add color" };
color.removeColor = { type: "action", label: "Remove last color" };
color.saturation = [defaults.saturation, 0, 1, 0.01];
color.depth = [defaults.depth, 0.3, 2.5, 0.05];

const kit = DialKit.createDialKit("Ink", {
  Brush: {
    size: [defaults.size, 6, 140, 1],
    inkAmount: [defaults.inkAmount, 0.1, 3, 0.05],
    holdInk: [defaults.holdInk, 0, 2, 0.05],
    flow: [defaults.flow, 0, 3, 0.05],
  },
  Spread: {
    bloom: [defaults.bloom, 0, 4, 0.05],
    spreadSpeed: [defaults.spreadSpeed, 0, 1, 0.01],
    edgeRoughness: [defaults.edgeRoughness, 0, 1, 0.01],
    edgeSoftness: [defaults.edgeSoftness, 0, 1, 0.01],
    grain: [defaults.grain, 1, 20, 0.5],
    turbulence: [defaults.turbulence, 0, 3, 0.05],
    swirl: [defaults.swirl, 0, 30, 0.5],
  },
  Fade: {
    fadeSpeed: [defaults.fadeSpeed, 0, 3, 0.01],
    settle: [defaults.settle, 0.1, 8, 0.1],
  },
  Color: color,
  Scene: {
    background: defaults.background,
    quality: { type: "select", options: ["Low", "Medium", "High"], default: "High" },
    showHint: false,
    clear: { type: "action", label: "Clear ink" },
  },
}, {
  onAction(path) {
    if (path.endsWith("clear")) ink.clear();
    else if (path.endsWith("addColor") && colorCount < MAX_COLORS) { colorCount++; apply(kit.getValues()); }
    else if (path.endsWith("removeColor") && colorCount > 1) { colorCount--; apply(kit.getValues()); }
  },
});

function setShown(el, show) {
  const v = show ? "" : "none";
  if (el && el.style.display !== v) el.style.display = v;
}
function syncPanel() {
  const custom = colorMode === "Custom";
  document.querySelectorAll(".dialkit-color-control").forEach(row => {
    const m = /^Color (\d)$/.exec(row.querySelector(".dialkit-color-label")?.textContent || "");
    if (m) setShown(row, custom && +m[1] <= colorCount);
  });
  document.querySelectorAll("button.dialkit-button").forEach(btn => {
    const label = btn.textContent.trim();
    if (label === "Add color") setShown(btn, custom && colorCount < MAX_COLORS);
    if (label === "Remove last color") setShown(btn, custom && colorCount > 1);
  });
}
new MutationObserver(syncPanel).observe(document.body, { childList: true, subtree: true });

function apply(v) {
  const c = v.Color, s = v.Scene;
  colorMode = c.mode;
  const colors = [];
  for (let i = 1; i <= colorCount; i++) colors.push(c["color " + i]);
  ink.set({
    ...v.Brush, ...v.Spread, ...v.Fade,
    mode: c.mode.toLowerCase(), colors,
    hueSpeed: c.hueSpeed, newHueEachClick: c.newHueEachClick,
    saturation: c.saturation, depth: c.depth,
    background: s.background, quality: s.quality.toLowerCase(),
  });
  document.body.style.background = s.background;
  hint.style.display = s.showHint ? "" : "none";
  syncPanel();
}
kit.subscribe(apply);
</script>
